function matches(item, word){
  if(!word) return false;
  if(item.name.includes(word)) return true;
  for(const tag of item.tags){
    if(tag===word) return true;
    if(NEG_PREFIX.some(p=>tag.startsWith(p))) continue;
    if(tag.includes(word)) return true;
  }
  return false;

function chooseCoupons(total,coupons){
  const pool=coupons.filter(c=>c.threshold<=total);
  if(!pool.length) return {chosen:[],discount:0};
  const bySource={};
  pool.forEach(c=>{(bySource[c.source]=bySource[c.source]||[]).push(c);});
  const keys=Object.keys(bySource);
  let best={chosen:[],discount:0};
  const walk=(i,picked,disc)=>{
    if(i===keys.length){
      if(disc>best.discount) best={chosen:picked.slice(),discount:disc};
      return;
    }
    walk(i+1,picked,disc);
    for(const c of bySource[keys[i]]) walk(i+1,picked.concat([c]),disc+c.discount);

}

  for(const [code,detail] of Object.entries(DETAILS)){
    const opts=detail.components.map(c=>{
      const list=[{code:c.code,name:c.name,priceDelta:0,qty:c.qty||1,replaced:false}];
      (c.replaceOptions||[]).forEach(o=>list.push({code:o.code,name:o.name,priceDelta:o.priceDelta,qty:c.qty||1,replaced:true}));
      return list;
    });
    const combos=[[]];
    for(const group of opts){
      const next=[];
      for(const partial of combos) for(const pick of group) next.push(partial.concat([pick]));
      combos.length=0; combos.push(...next);
    }
    for(const combo of combos){
      const items=[],swaps=[];let delta=0;
      detail.components.forEach((orig,i)=>{
        const pick=combo[i];
        delta+=pick.priceDelta*pick.qty;
        items.push(toItem(pick.code,pick.name,unitPrice(pick.code)+pick.priceDelta,pick.qty));
        if(pick.replaced) swaps.push(`${orig.name} → ${pick.name}`);
      });
      if(!inPeriod(items,period)) continue;
      // 套餐走整包计价：组件单价归零，总价由整包行承担，否则会与整包价重复累加
      items.forEach(x=>{x.price=0;});
      items.push({code,name:detail.name,qty:1,price:detail.price+delta,
        kcal:0,protein:0,fat:0,carb:0,sodium:0,tags:[],isBundle:true});
      out.push({items,setName:detail.name,swaps});
    }
  }
  return out;
}
function buildFromItems(period,wantDessert){
  const pool=cat=>MEALS.filter(m=>m.category===cat&&(!period||!m.mealPeriods||m.mealPeriods.includes(period)));
  let mains=pool("主食"); if(!mains.length) mains=pool("早餐");
  const sides=pool("配餐"),drinks=pool("饮品"),desserts=wantDessert?pool("甜品"):[null];
  const out=[];
  for(const a of mains) for(const b of sides) for(const c of drinks) for(const d of desserts){
    const parts=[a,b,c].concat(d?[d]:[]);
    out.push({items:parts.map(p=>toItem(p.code,p.name,p.price,1)),setName:"单品自由组合",swaps:[]});
  }
  return out;
}
function score(s,cfg){
  let sc=0;const reasons=[];const real=s.items.filter(i=>!i.isBundle);
  const pairs=cfg.likes.map(l=>[l,real.filter(i=>matches(i,l)).map(i=>i.name)]);
  const hits=pairs.filter(p=>p[1].length);
  if(hits.length){sc+=W_TASTE*hits.length;
    reasons.push("命中口味："+hits.map(p=>`${p[0]}(${p[1].join("/")})`).join("、"));}
  const lo=Math.max(0,cfg.kcal-150),hi=cfg.kcal+150;
  if(s.kcal>=lo&&s.kcal<=hi){
    sc+=W_IN_TARGET;
    reasons.push(`热量 ${Math.round(s.kcal)} kcal，落在 ${lo}–${hi} 目标区间`);
    // 越靠近目标中位越优，与 scripts/diy_mc.py 的打分口径保持一致
    const mid=(lo+hi)/2, half=Math.max(1,(hi-lo)/2);
    sc+=Math.max(0,1-Math.abs(s.kcal-mid)/half);
  }
  else{const over=s.kcal>hi?s.kcal-hi:lo-s.kcal;sc-=KCAL_PENALTY_PER_100*(over/100);
    reasons.push(`热量 ${Math.round(s.kcal)} kcal，偏离目标区间`);}
  const ratio=1-(s.final/cfg.budget); sc+=W_VALUE*Math.max(0,ratio);
  reasons.push(`到手 ¥${s.final.toFixed(2)}，占预算 ${Math.round(s.final/cfg.budget*100)}%`);
  if(s.original>0){const r=s.discount/s.original;sc+=W_COUPON*r;
    if(s.coupons.length) reasons.push(`用券 ${s.coupons.length} 张，省 ¥${s.discount.toFixed(2)}（利用率 ${Math.round(r*100)}%）`);}
  if(s.setName!=="单品自由组合"){sc+=0.5;reasons.push("走套餐路径，整包计价更划算");}
  return {sc,reasons};
}
function generate(cfg){
  const raw=buildFromSets(cfg.period)
    .concat(buildFromItems(cfg.period,cfg.wantDessert));
  const list=[];
  for(const r of raw){
    if(blocked(r.items,cfg.dislikes)) continue;
    const total=r.items.reduce((a,i)=>a+i.price*i.qty,0);
    const {chosen,discount}=chooseCoupons(total,COUPONS);
    const final=Math.max(0,total-discount);
    if(final>cfg.budget+1e-6) continue;
    const s={items:r.items,setName:r.setName,swaps:r.swaps,original:total,
      coupons:chosen,discount,final:Math.round(final*100)/100,
      kcal:r.items.reduce((a,i)=>a+i.kcal*i.qty,0),
      protein:r.items.reduce((a,i)=>a+i.protein*i.qty,0),
      fat:r.items.reduce((a,i)=>a+i.fat*i.qty,0),
      carb:r.items.reduce((a,i)=>a+i.carb*i.qty,0),
      sodium:r.items.reduce((a,i)=>a+i.sodium*i.qty,0)};
    const {sc,reasons}=score(s,cfg); s.score=sc; s.reasons=reasons;
    list.push(s);
  }
  list.sort((a,b)=>b.score-a.score);
  const seen=new Set(),out=[];
  for(const s of list){
    const key=s.items.map(i=>i.code).sort().join("|");
    if(seen.has(key)) continue;
    seen.add(key); out.push(s);
    if(out.length>=MAX_RESULTS) break;
  }
  return out;
}

const LIKE_OPTS=["辣","炸","牛肉","鸡肉","鱼","咖啡","甜","轻食","低卡"];
const NO_OPTS=["牛肉","炸","甜","辣","碳酸","咖啡"];
const MEDALS=["🥇","🥈","🥉"];
const fmt=n=>Math.round(n).toLocaleString("en-US");
let cfg={budget:30,kcal:700,likes:[],dislikes:[],period:"",wantDessert:false};

function chipRow(el,opts,key,cls){
  el.innerHTML="";
  opts.forEach(o=>{
    const d=document.createElement("div");
    d.className="chip"+(cls?" no":"")+(cfg[key].includes(o)?" on":"");
    d.textContent=o;
    d.onclick=()=>{
      const i=cfg[key].indexOf(o);
      if(i>=0) cfg[key].splice(i,1); else cfg[key].push(o);
      d.classList.toggle("on"); render();
    };
    el.appendChild(d);
  });
}
function schemeHTML(s,i){
  const combo=s.items.filter(x=>!x.isBundle).map(x=>x.qty>1?`${x.name}×${x.qty}`:x.name).join(" + ");
  const swaps=s.swaps.map(x=>`<span class="swap">${x}</span>`).join(" ");
  const coupons=s.coupons.length?s.coupons.map(c=>c.name).join("、"):"未命中可用券";
  const isSet=s.setName!=="单品自由组合";
  return `<div class="scheme${i===0?" top":""}">
    <div class="scheme-head">
      <div>
        <div class="scheme-name"><span class="medal">${MEDALS[i]||"·"} 方案 ${i+1}</span>${isSet?s.setName:"单品自由组合"}</div>
      </div>
      <div class="price"><b>¥${s.final.toFixed(2)}</b><s>原价 ¥${s.original.toFixed(2)} ｜ 省 ¥${s.discount.toFixed(2)}</s></div>
    </div>
    <div class="rows">
      <div class="row"><span class="k">组合</span><span class="v">${combo}</span></div>
      ${swaps?`<div class="row"><span class="k">DIY 替换</span><span class="v">${swaps}</span></div>`:""}
      <div class="row"><span class="k">用量</span><span class="v">${coupons}</span></div>
      <div class="row"><span class="k">营养</span><span class="v nutri">
        <span>能量 <b>${fmt(s.kcal)}</b> kcal</span>
        <span>蛋白 <b>${fmt(s.protein)}</b> g</span>
        <span>脂肪 <b>${fmt(s.fat)}</b> g</span>
        <span>碳水 <b>${fmt(s.carb)}</b> g</span>
        <span>钠 <b>${fmt(s.sodium)}</b> mg</span>
      </span></div>
    </div>
    <div class="why"><b>为什么是它：</b>${s.reasons.join("；")}</div>
  </div>`;
}
function render(){
  cfg.budget=+document.getElementById("budget").value;
  cfg.kcal=+document.getElementById("kcal").value;
  cfg.period=document.getElementById("period").value;
  document.getElementById("vBudget").textContent="¥"+cfg.budget;
  document.getElementById("vKcal").textContent=cfg.kcal+" kcal";
  const box=document.getElementById("results");
  const out=generate(cfg);
  box.innerHTML=out.length?out.map(schemeHTML).join("")
    :`<div class="empty">没有满足全部约束的方案。<br>试试放宽预算或热量区间，或减少忌口项。</div>`;
}

chipRow(document.getElementById("likes"),LIKE_OPTS,"likes",false);
chipRow(document.getElementById("dislikes"),NO_OPTS,"dislikes",true);
(function(){
  const el=document.getElementById("opts");
  const d=document.createElement("div");
  d.className="chip";d.textContent="来点甜品";
  d.onclick=()=>{cfg.wantDessert=!cfg.wantDessert;d.classList.toggle("on");render();};
  el.appendChild(d);
})();
document.getElementById("budget").oninput=render;
document.getElementById("kcal").oninput=render;
document.getElementById("period").onchange=render;
render();
</script>
